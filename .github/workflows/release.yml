name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false
          skip_github_release: true  # Skip creating the default GitHub release with source code

      - name: Create custom release with only PDF
        run: |
          cp pdf/sl.pdf songbook.pdf
          gh release create ${{ github.ref_name }} songbook_${{ github.ref_name }}.pdf \
            --title "Release ${{ github.ref_name }}" \
            --notes "Songbook PDF release ${{ github.ref_name }}" \
            --generate-notes=false \
            --verify-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
